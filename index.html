<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#7954d8"><title>Secret Manitto 💌</title><style>*{box-sizing:border-box}body{font-family:system-ui,-apple-system,sans-serif;background:#f4f0ff;color:#29223b;margin:0}main{max-width:600px;margin:40px auto;padding:20px}h1{font-size:32px;margin-bottom:4px}h2{font-size:21px}.panel{background:white;border-radius:22px;padding:26px;margin:18px 0;box-shadow:0 8px 26px #30205612}input,select,textarea,button{width:100%;font:inherit;padding:14px;border:1px solid #ded4ef;border-radius:12px;margin:7px 0}button{background:#7954d8;color:white;border:0;font-weight:700;cursor:pointer}button:disabled{opacity:.5}.secondary{background:#eee8fc;color:#6040b4}.muted{font-size:13px;color:#746b83}.pill{display:inline-block;border-radius:20px;background:#eee5ff;padding:6px 12px}.message{background:#f4efff;padding:14px;border-radius:12px;margin:10px 0;white-space:pre-wrap;overflow-wrap:anywhere}.hidden{display:none}#notice{min-height:24px;color:#a12761;font-weight:600}textarea{min-height:110px;resize:vertical}</style></head><body><main><h1>🎁 Secret Manitto</h1><p>정체는 비밀, 마음은 전달!</p><div id="notice" role="status"></div><section class="panel" id="entry"><h2>방 만들기 / 입장하기</h2><input id="name" placeholder="내 이름" maxlength="24"><input id="code" placeholder="방 코드 (새 방은 비워 두세요)" maxlength="10"><button id="start">시작하기</button><p class="muted">새 방은 코드를 비워 두고 시작해. 친구들은 네 방 코드를 입력하면 돼.</p></section><section id="room" class="hidden"><div class="panel"><h2>우리 마니또 방 <span class="pill" id="roomCode"></span></h2><p>내 이름: <strong id="myName"></strong></p><p class="muted">참가자: <span id="members"></span></p><button id="copy" class="secondary">초대 메시지 복사</button><button id="leave" class="secondary">나가기 (이 기기에서만)</button></div><div class="panel"><h2>💌 익명 메시지 보내기</h2><label for="recipient">받을 친구</label><select id="recipient"></select><textarea id="message" maxlength="500" placeholder="예: 오늘 라커 확인해 봐 🎁"></textarea><button id="send">익명으로 보내기</button><p class="muted">받는 사람에게는 보낸 사람 이름이 표시되지 않아.</p></div><div class="panel"><h2>📬 내 메시지함</h2><button id="refresh" class="secondary">새로고침</button><div id="inbox" aria-live="polite">아직 메시지가 없어.</div><p class="muted">10초마다 새 메시지를 확인해.</p></div></section><p class="muted">방 코드를 아는 사람은 새 이름으로 입장할 수 있어. 민감한 정보는 보내지 마. 이 버전에는 휴대폰 푸시 알림이 없어.</p></main><script>
const $=id=>document.getElementById(id);let session=null;const notify=t=>{$('notice').textContent=t;setTimeout(()=>{if($('notice').textContent===t)$('notice').textContent=''},5500)};
async function api(data){const r=await fetch('/.netlify/functions/api',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(data)});let v;try{v=await r.json()}catch{throw Error('서버에 연결할 수 없어. Netlify Functions 배포를 확인해 줘.')};if(!r.ok)throw Error(v.error||'오류가 발생했어.');return v}
function show(){ $('entry').classList.add('hidden');$('room').classList.remove('hidden');$('roomCode').textContent=session.code;$('myName').textContent=session.name;update() }
$('start').onclick=async()=>{const name=$('name').value.trim(),code=$('code').value.trim().toUpperCase();if(!name)return notify('이름을 입력해 줘.');$('start').disabled=true;try{session=await api({action:code?'join':'create',name,code});localStorage.setItem('manitto-session',JSON.stringify(session));show()}catch(e){notify(e.message)}finally{$('start').disabled=false}};
async function update(){if(!session)return;try{const state=await api({...session,action:'state'});$('members').textContent=state.members.map(m=>m.name).join(', ');const prev=$('recipient').value;$('recipient').replaceChildren();for(const m of state.members.filter(m=>m.uid!==session.uid)){const o=document.createElement('option');o.value=m.uid;o.textContent=m.name;$('recipient').append(o)}if([...$('recipient').options].some(o=>o.value===prev))$('recipient').value=prev;const box=$('inbox');box.replaceChildren();if(!state.messages.length){box.textContent='아직 메시지가 없어.'}else for(const m of state.messages){const d=document.createElement('div');d.className='message';const time=document.createElement('small');time.textContent='🎁 익명의 마니또 · '+new Date(m.time).toLocaleString('ko-KR');const p=document.createElement('div');p.textContent=m.body;d.append(time,p);box.append(d)}}catch(e){notify(e.message)}}
$('send').onclick=async()=>{if(!session)return;const to=$('recipient').value,body=$('message').value.trim();if(!to||!body)return notify('친구와 메시지를 입력해 줘.');$('send').disabled=true;try{await api({...session,action:'send',to,body});$('message').value='';notify('익명 메시지를 보냈어!')}catch(e){notify(e.message)}finally{$('send').disabled=false}};
$('refresh').onclick=update;$('copy').onclick=async()=>{const t=`🎁 Secret Manitto에 초대해!\n${location.origin}\n방 코드: ${session.code}`;try{await navigator.clipboard.writeText(t);notify('초대 메시지를 복사했어!')}catch{notify('방 코드와 주소를 직접 복사해 줘.')}};
$('leave').onclick=()=>{localStorage.removeItem('manitto-session');session=null;location.reload()};try{const s=JSON.parse(localStorage.getItem('manitto-session'));if(s?.token&&s?.uid&&s?.code){session=s;show()}}catch{}setInterval(()=>{if(session)update()},10000);
</script></body></html>
